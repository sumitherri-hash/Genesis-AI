services:
  - type: web
    name: genesis-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn genesis_entry:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: GENESIS_ADMIN_KEY
        generateValue: true
      # Begin the first evidence-led discovery cycle on deployment, once only.
      - key: GENESIS_AUTOPILOT_BOOTSTRAP
        value: "true"
      # Bound provider use: one company research cycle every six hours.
      - key: POLL_SECONDS
        value: "21600"
      - key: MAX_TASKS_PER_CYCLE
        value: "1"
      - key: COUNCIL_POLL_SECONDS
        value: "15"
      - key: COUNCIL_MAX_DAILY_CALLS
        value: "24"
      - key: COUNCIL_MAX_ATTEMPTS
        value: "3"
      - key: COUNCIL_MISSION_INTERVAL_SECONDS
        value: "21600"
      - key: COMPANY_LOOP_POLL_SECONDS
        value: "20"
      - key: COMPANY_MEMORY_LIMIT
        value: "8"
