services:

- type: web
  name: genesis-ai
  runtime: python
  plan: free
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
  envVars:
  - key: PYTHON_VERSION
    value: 3.11.9
  - key: LLM_BASE_URL
    value: https://api.openai.com/v1
  - key: LLM_MODEL
    value: gpt-4o-mini
  - key: LLM_API_KEY
    sync: false
  - key: GENESIS_ADMIN_KEY
    generateValue: true
  - key: POLL_SECONDS
    value: "90"
